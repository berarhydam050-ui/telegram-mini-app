<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Image to 3D Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0e1621);
            --text: var(--tg-theme-text-color, #ffffff);
            --btn: var(--tg-theme-button-color, #2aabee);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary: var(--tg-theme-secondary-bg-color, #17212b);
            --hint: var(--tg-theme-hint-color, #708499);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.35rem; margin-bottom: 18px; font-weight: 600; }
        .card {
            background: var(--secondary);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 16px;
        }
        .upload-box {
            border: 2px dashed var(--btn);
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
        }
        .upload-box:active { opacity: 0.8; }
        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            display: none;
            margin: 10px auto 0;
            object-fit: contain;
        }
        input[type="file"] { display: none; }
        .btn {
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn-secondary {
            background: transparent;
            border: 1.5px solid var(--btn);
            color: var(--btn);
        }
        #status {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--hint);
            text-align: center;
            min-height: 22px;
        }
        model-viewer {
            width: 100%;
            height: 320px;
            background: #0a1018;
            border-radius: 14px;
            margin-top: 14px;
            display: none;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
        }
        .actions .btn { margin-top: 0; flex: 1; }
        .gallery-title {
            width: 100%;
            max-width: 380px;
            margin: 24px 0 12px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery {
            width: 100%;
            max-width: 380px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .gallery-item {
            background: var(--secondary);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }
        .gallery-item .meta {
            padding: 8px 10px;
            font-size: 0.75rem;
            color: var(--hint);
        }
        .empty-gallery {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--hint);
            padding: 30px 10px;
            font-size: 0.9rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>2D Image to 3D Model</h1>
    <div class="card">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <span id="uploadText">Tap to select an image</span>
            <img id="preview-img" alt="Preview" />
            <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)" />
        </div>
        <button id="generateBtn" class="btn" onclick="generate3D()" disabled>Generate 3D Model</button>
        <div id="status"></div>
        <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1.15"
            environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr">
        </model-viewer>
        <div class="actions" id="actionButtons" style="display:none;">
            <button class="btn" onclick="downloadModel()">Download GLB</button>
            <button class="btn btn-secondary" onclick="saveToGallery()">Save to Gallery</button>
        </div>
    </div>
    <div class="gallery-title">
        <span>My Gallery</span>
        <span id="galleryCount" style="font-size:0.85rem;color:var(--hint);"></span>
    </div>
    <div class="gallery" id="gallery"></div>
    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();
        const MODAL_BASE = "https://berarhydam050--sf3d-backend-generate.modal.run";
        let selectedBase64 = "";
        let currentModelUrl = null;
        let currentAssetId = null;
        let currentPreview = null;

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64 = e.target.result;
                currentPreview = selectedBase64;
                const previewImg = document.getElementById("preview-img");
                previewImg.src = selectedBase64;
                previewImg.style.display = "block";
                document.getElementById("uploadText").style.display = "none";
                document.getElementById("generateBtn").disabled = false;
                document.getElementById("viewer").style.display = "none";
                document.getElementById("actionButtons").style.display = "none";
                document.getElementById("status").innerText = "";
                currentModelUrl = null;
                currentAssetId = null;
            };
            reader.readAsDataURL(file);
        }

        async function generate3D() {
            const btn = document.getElementById("generateBtn");
            const status = document.getElementById("status");
            const viewer = document.getElementById("viewer");
            const actions = document.getElementById("actionButtons");
            btn.disabled = true;
            actions.style.display = "none";
            viewer.style.display = "none";
            status.innerHTML = '<span class="spinner"></span> Generating on GPU... (first time ~1 min)';
            try {
                const response = await fetch(MODAL_BASE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        image: selectedBase64,
                        texture_resolution: 2048,
                        remesh: "none"
                    })
                });
                const data = await response.json();
                if (!response.ok || data.detail || data.error) {
                    status.innerText = "Error: " + (data.detail || data.error || "Generation failed");
                    btn.disabled = false;
                    return;
                }
                if (data.model) {
                    const byteCharacters = atob(data.model);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
                    const blob = new Blob([new Uint8Array(byteNumbers)], { type: "model/gltf-binary" });
                    currentModelUrl = URL.createObjectURL(blob);
                    currentAssetId = data.asset_id || Date.now().toString();
                    viewer.src = currentModelUrl;
                    viewer.style.display = "block";
                    actions.style.display = "flex";
                    status.innerText = "✅ 3D model ready! Rotate it or download.";
                } else if (data.asset_id) {
                    currentAssetId = data.asset_id;
                    status.innerHTML = '<span class="spinner"></span> Downloading 3D model...';
                    const glbResponse = await fetch(MODAL_BASE + "/download/" + data.asset_id);
                    if (!glbResponse.ok) throw new Error("Could not download the GLB file");
                    const blob = await glbResponse.blob();
                    currentModelUrl = URL.createObjectURL(blob);
                    viewer.src = currentModelUrl;
                    viewer.style.display = "block";
                    actions.style.display = "flex";
                    status.innerText = "✅ 3D model ready! Rotate it or download.";
                } else {
                    status.innerText = "Failed to retrieve the 3D model asset.";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Failed: " + (error.message || "Connection error");
            } finally {
                btn.disabled = false;
            }
        }

        function downloadModel() {
            if (!currentModelUrl) return;
            const a = document.createElement("a");
            a.href = currentModelUrl;
            a.download = "sf3d-model-" + (currentAssetId || Date.now()) + ".glb";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.notificationOccurred("success");
        }

        function getGallery() {
            try { return JSON.parse(localStorage.getItem("sf3d_gallery") || "[]"); }
            catch { return []; }
        }

        function saveToGallery() {
            if (!currentModelUrl || !currentPreview) return;
            fetch(currentModelUrl).then(r => r.blob()).then(blob => {
                const reader = new FileReader();
                reader.onload = () => {
                    const gallery = getGallery();
                    gallery.unshift({
                        id: currentAssetId || Date.now().toString(),
                        preview: currentPreview,
                        model: reader.result,
                        created: new Date().toISOString()
                    });
                    if (gallery.length > 20) gallery.length = 20;
                    localStorage.setItem("sf3d_gallery", JSON.stringify(gallery));
                    renderGallery();
                    if (Telegram.HapticFeedback) Telegram.HapticFeedback.notificationOccurred("success");
                    document.getElementById("status").innerText = "Saved to Gallery!";
                };
                reader.readAsDataURL(blob);
            });
        }

        function renderGallery() {
            const gallery = getGallery();
            const container = document.getElementById("gallery");
            const countEl = document.getElementById("galleryCount");
            countEl.innerText = gallery.length ? gallery.length + " models" : "";
            if (gallery.length === 0) {
                container.innerHTML = '<div class="empty-gallery">No models saved yet.<br>Generate one and tap "Save to Gallery".</div>';
                return;
            }
            container.innerHTML = gallery.map((item, idx) =>
                '<div class="gallery-item" onclick="loadFromGallery(' + idx + ')">' +
                '<img src="' + item.preview + '" alt="Model" />' +
                '<div class="meta">' + new Date(item.created).toLocaleDateString() + '</div></div>'
            ).join("");
        }

        function loadFromGallery(index) {
            const gallery = getGallery();
            const item = gallery[index];
            if (!item) return;
            const viewer = document.getElementById("viewer");
            const actions = document.getElementById("actionButtons");
            const byteString = atob(item.model.split(",")[1] || item.model);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            const blob = new Blob([ab], { type: "model/gltf-binary" });
            if (currentModelUrl) URL.revokeObjectURL(currentModelUrl);
            currentModelUrl = URL.createObjectURL(blob);
            currentAssetId = item.id;
            currentPreview = item.preview;
            viewer.src = currentModelUrl;
            viewer.style.display = "block";
            actions.style.display = "flex";
            document.getElementById("status").innerText = "Loaded from Gallery";
            const previewImg = document.getElementById("preview-img");
            previewImg.src = item.preview;
            previewImg.style.display = "block";
            document.getElementById("uploadText").style.display = "none";
        }

        renderGallery();
    </script>
</body>
</html>
