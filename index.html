<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF 3D Studio</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --tg-theme-bg-color: #121212;
            --tg-theme-text-color: #ffffff;
            --tg-theme-card-bg: #1e1e1e;
            --tg-theme-button-color: #0088cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #888888;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0; padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-card-bg);
            border-radius: 12px; padding: 16px; margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none; border-radius: 8px; padding: 12px;
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer;
            text-align: center; display: block; text-decoration: none;
        }
        .btn:disabled { opacity: 0.5; }
        input[type="text"], input[type="file"] {
            width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color);
            background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color);
            box-sizing: border-box;
        }
        .status { font-size: 14px; text-align: center; margin-top: 10px; color: #0088cc; }
    </style>
</head>
<body>
    <h2>SF 3D Studio</h2>

    <!-- Account Balance Card -->
    <div class="card">
        <h3>Account Status</h3>
        <p>Daily Points Progress: <span id="dailyProgress">0</span> / 15</p>
        <p>Wallet Balance: <span id="walletBalance">0</span> Points</p>
    </div>

    <!-- Payment Area -->
    <div class="card">
        <h3>Instant Unlock</h3>
        <p style="font-size: 13px; color: var(--tg-theme-hint-color);">Pay ₹6 via UPI to get instant points</p>
        <a href="upi://pay?pa=YOUR_UPI_ID@okicici&pn=FixKendra&am=6&cu=INR&tn=3D_Generation" class="btn">Pay ₹6 via UPI App</a>
        
        <label style="display:block; margin-top:12px;">Enter 12-Digit UTR Number after payment:</label>
        <input type="text" id="utrInput" placeholder="e.g. 423156789012">
        <button class="btn" style="margin-top: 8px;" onclick="submitUTR()">Verify & Credit Points</button>
    </div>

    <!-- Generation Workspace -->
    <div class="card">
        <h3>Generate 3D Model</h3>
        <label>Upload a clean photo (PNG/JPG):</label>
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn" id="generateBtn" style="margin-top: 12px;" onclick="generate3D()">Generate 3D (15 Points)</button>
        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_BASE = "https://lhr.life";
        const userId = tg.initDataUnsafe?.user?.id || "6187218793";

        // Handle UTR submission
        async function submitUTR() {
            const utr = document.getElementById('utrInput').value.trim();
            if (utr.length !== 12 || isNaN(utr)) {
                alert("Please enter a valid 12-digit UTR transaction number.");
                return;
            }
            alert("UTR submitted for verification! Points will credit shortly.");
        }

        // Handle 3D Engine compilation call
        async function generate3D() {
            const fileInput = document.getElementById('imageInput');
            const statusMessage = document.getElementById('statusMessage');
            const generateBtn = document.getElementById('generateBtn');

            if (!fileInput.files[0]) {
                alert("Please select an image file first!");
                return;
            }

            generateBtn.disabled = true;
            statusMessage.innerText = "Sending image to your Termux phone environment...";

            const formData = new FormData();
            formData.append('telegram_id', userId);
            formData.append('image', fileInput.files[0]);

            try {
                const response = await fetch(`${API_BASE}/process-3d`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    statusMessage.innerText = "Success! Check your Bot chat window.";
                    tg.showAlert("Your phone running Termux successfully processed this file!");
                } else {
                    statusMessage.innerText = "Failed to communicate with phone tunnel.";
                    generateBtn.disabled = false;
                }
            } catch (e) {
                statusMessage.innerText = "Connection error. Make sure your Termux terminal is running.";
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
