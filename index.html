<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SF3D Studio</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #121824;
      --card-border: #1e293b;
      --accent-purple: #6366f1;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-badge {
      font-size: 10px;
      background: #1e1b4b;
      color: #818cf8;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #312e81;
      display: inline-block;
      margin-top: 2px;
    }

    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .upload-box {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
    }

    .upload-icon {
      width: 56px;
      height: 56px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      overflow: hidden;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .upload-heading {
      font-size: 14px;
      font-weight: 600;
    }

    .upload-subtext {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 240px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .action-btn.primary {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .canvas-viewport {
      width: 100%;
      height: 240px;
      background: #070a0f;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      gap: 10px;
      padding: 16px;
      text-align: center;
    }

    .icon-btn-group {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .icon-btn.success {
      background: #10b981;
      border-color: #10b981;
    }

    #fileInput, #cameraInputFallback {
      display: none;
    }

    /* Live Camera Overlay Modal */
    .camera-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .camera-view {
      width: 100%;
      height: 75vh;
      border-radius: 16px;
      object-fit: cover;
      background: #111;
    }

    .camera-controls {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
    }

    .capture-circle-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Hidden Fallback Inputs -->
  <input type="file" id="fileInput" accept="image/*">
  <input type="file" id="cameraInputFallback" accept="image/*" capture="environment">

  <!-- Live Camera Modal Container -->
  <div class="camera-modal" id="cameraModal">
    <video id="cameraStream" autoplay playsinline class="camera-view"></video>
    <div class="camera-controls">
      <button class="action-btn" type="button" onclick="closeLiveCamera()">❌ Cancel</button>
      <button class="capture-circle-btn" type="button" onclick="captureLivePhoto()">📸</button>
    </div>
    <canvas id="snapshotCanvas" style="display:none;"></canvas>
  </div>

  <div class="app-container">
    <div class="header-card">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <div>
          <div class="brand-title">SF3D Studio</div>
          <span class="brand-badge">AI 3D Generator</span>
        </div>
      </div>
    </div>

    <div class="content-card">
      <div class="card-title-row">
        <div class="card-title">📷 Select Image</div>
        <div class="card-subtitle">JPG, PNG, WEBP</div>
      </div>

      <div class="upload-box" onclick="triggerFileBrowser()">
        <div class="upload-icon">
          <span id="iconEmoji">☁️</span>
          <img id="previewImg" class="preview-img" alt="Preview">
        </div>
        <div class="upload-heading" id="uploadHeading">Tap to upload or take a photo</div>
        <div class="upload-subtext" id="uploadSubtext">Single subject with clear lighting works best</div>

        <div class="button-group">
          <button class="action-btn" type="button" onclick="event.stopPropagation(); triggerFileBrowser();">📁 Gallery</button>
          <button class="action-btn primary" type="button" onclick="event.stopPropagation(); openCamera();">📷 Mobile Camera</button>
        </div>
      </div>
    </div>

    <div class="content-card">
      <div class="card-title-row">
        <div class="card-title">
          <span style="height: 8px; width: 8px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
          3D MODEL VIEWPORT
        </div>
        <div class="icon-btn-group">
          <button class="icon-btn" onclick="resetCanvas()">🔄</button>
          <button class="icon-btn success" id="downloadBtn" style="display:none;" onclick="download3DMesh()">⬇️</button>
        </div>
      </div>
      
      <div class="canvas-viewport" id="canvasViewport">
        <p id="canvasStatus">Upload an image to start 3D generation</p>
        <button class="action-btn primary" id="generateBtn" style="display:none; max-width: 220px;" onclick="startRunPodGeneration()">⚡ Generate 3D Model</button>
      </div>
    </div>
  </div>

  <script>
    const RUNPOD_ENDPOINT_ID = "bs1w90sxxkdyfs";
    const RUNPOD_API_KEY = "YOUR_RUNPOD_API_KEY"; // Replace with your actual RunPod API key

    let currentBase64Image = null;
    let activeStream = null;

    function triggerFileBrowser() {
      document.getElementById('fileInput').click();
    }

    async function openCamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          const videoElem = document.getElementById('cameraStream');
          videoElem.srcObject = activeStream;
          document.getElementById('cameraModal').style.display = 'flex';
          return;
        } catch (err) {
          console.warn("MediaDevices failed, resorting to standard input capture", err);
        }
      }
      // Fallback if WebView blocks getUserMedia
      document.getElementById('cameraInputFallback').click();
    }

    function captureLivePhoto() {
      const videoElem = document.getElementById('cameraStream');
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = videoElem.videoWidth || 640;
      canvas.height = videoElem.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      currentBase64Image = dataUrl.split(',')[1];

      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('previewImg').style.display = 'block';
      document.getElementById('iconEmoji').style.display = 'none';

      document.getElementById('uploadHeading').innerText = "Photo Captured!";
      document.getElementById('uploadSubtext').innerText = "Ready to create 3D mesh";
      document.getElementById('generateBtn').style.display = 'inline-block';

      closeLiveCamera();

      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }
    }

    function closeLiveCamera() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
      document.getElementById('cameraModal').style.display = 'none';
    }

    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentBase64Image = e.target.result.split(',')[1];
          document.getElementById('previewImg').src = e.target.result;
          document.getElementById('previewImg').style.display = 'block';
          document.getElementById('iconEmoji').style.display = 'none';

          document.getElementById('uploadHeading').innerText = "Image Selected!";
          document.getElementById('uploadSubtext').innerText = file.name;
          document.getElementById('generateBtn').style.display = 'inline-block';
          
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          }
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('fileInput').addEventListener('change', handleImageSelection);
    document.getElementById('cameraInputFallback').addEventListener('change', handleImageSelection);

    async function startRunPodGeneration() {
      if (!currentBase64Image) return;

      const status = document.getElementById('canvasStatus');
      const genBtn = document.getElementById('generateBtn');
      genBtn.style.display = 'none';
      status.innerHTML = "🚀 Booting GPU Worker... (Cold start ~30-60s)";

      try {
        const response = await fetch(`https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${RUNPOD_API_KEY}`
          },
          body: JSON.stringify({ input: { image: currentBase64Image } })
        });

        const data = await response.json();
        if (data.id) {
          pollStatus(data.id);
        } else {
          status.innerText = "❌ Failed to queue task.";
        }
      } catch (err) {
        status.innerText = "❌ Network error starting generation.";
      }
    }

    async function pollStatus(jobId) {
      const status = document.getElementById('canvasStatus');
      
      const check = async () => {
        try {
          const res = await fetch(`https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${jobId}`, {
            headers: { "Authorization": `Bearer ${RUNPOD_API_KEY}` }
          });
          const data = await res.json();

          if (data.status === "IN_QUEUE") {
            status.innerHTML = "⏳ Spinning up GPU container...";
            setTimeout(check, 3000);
          } else if (data.status === "IN_PROGRESS") {
            status.innerHTML = "⚡ GPU Active: Synthesizing 3D Mesh...";
            setTimeout(check, 2000);
          } else if (data.status === "COMPLETED") {
            status.innerHTML = "✅ <strong>3D Model Ready!</strong>";
            document.getElementById('downloadBtn').style.display = 'inline-flex';
          } else if (data.status === "FAILED") {
            status.innerText = "❌ Generation failed: " + (data.error || "Error");
          }
        } catch (e) {
          setTimeout(check, 3000);
        }
      };
      check();
    }

    function resetCanvas() {
      document.getElementById('canvasStatus').innerText = "Upload an image to start 3D generation";
      document.getElementById('generateBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('iconEmoji').style.display = 'inline';
      document.getElementById('uploadHeading').innerText = "Tap to upload or take a photo";
      document.getElementById('uploadSubtext').innerText = "Single subject with clear lighting works best";
      currentBase64Image = null;
    }
  </script>
</body>
</html>
